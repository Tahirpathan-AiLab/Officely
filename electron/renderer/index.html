/* ---------- AI Model & API Key Modal ---------- */
const llmModal=document.getElementById("llm_modal");
const LLM_PROVIDERS={
  openai:{name:"OpenAI",url:"https://api.openai.com/v1",model:"gpt-4o-mini",desc:"Official ChatGPT models (gpt-4o-mini, gpt-4o)"},
  openrouter:{name:"OpenRouter",url:"https://openrouter.ai/api/v1",model:"google/gemini-2.0-flash-exp:free",desc:"Access 200+ AI models (Gemini, Claude, DeepSeek, Llama)"},
  groq:{name:"Groq",url:"https://api.groq.com/openai/v1",model:"llama-3.3-70b-versatile",desc:"Ultra-fast lightning inference (Llama 3.3, Mixtral)"},
  gemini:{name:"Google Gemini",url:"https://generativelanguage.googleapis.com/v1beta/openai/",model:"gemini-3.8-flash",keyHint:"Paste Gemini API key (AIza…)",desc:"Google Gemini models through the Gemini API"},
  ollama:{name:"Ollama (Local)",url:"http://localhost:11434",model:"llama3.2:latest",desc:"Run models locally on your PC / laptop"},
  custom:{name:"Custom Endpoint",url:"http://localhost:8000/v1",model:"gpt-4o-mini",desc:"Any custom OpenAI-compatible API endpoint"}
};
let llmState={provider:"openai",key:"",url:"",model:"",hasKey:false,maskedKey:""};
async function openLLMModal(){
  if(pmenu)pmenu.classList.remove("show");
  let s=null;
  if(window.robonestBridge&&window.robonestBridge.getLLMSettings){
    try{s=await window.robonestBridge.getLLMSettings()}catch(_){}
  }
  const loadError=s?"":"The backend is not connected yet. Please try again in a moment.";
  const curProv=(s&&s.provider&&LLM_PROVIDERS[s.provider])?s.provider:"openai";
  const defP=LLM_PROVIDERS[curProv];
  llmState={
    provider:curProv,
    key:"",
    url:(s&&(curProv==="ollama"?s.ollama_url:s.openai_base_url))||defP.url,
    model:(s&&(curProv==="ollama"?s.ollama_model:s.openai_model))||defP.model,
    hasKey:!!(s&&s.has_api_key),
    maskedKey:(s&&s.masked_api_key)||"",
    loadError
  };
  renderLLMModal();
}
function renderLLMModal(){
  if(!llmModal)return;
  const p=LLM_PROVIDERS[llmState.provider]||LLM_PROVIDERS.openai;
  const isOllama=llmState.provider==="ollama";
  llmModal.innerHTML=`
    <div class="pfc" style="max-width:540px" onclick="event.stopPropagation()">
      <div class="pfh">
        <b>🔑 AI Model &amp; API Key Settings</b>
        <button id="llm_btn_close" aria-label="Close">✕</button>
      </div>
      <div class="pfnote">
        Add an <b>API key</b> to connect Zed, Evaan, Athena, and Lumi to your preferred AI provider (OpenAI, OpenRouter, Groq, or Gemini).
      </div>
      ${llmState.loadError?`<div style="color:#e5484d;font-size:12px;margin-top:8px">${esc(llmState.loadError)}</div>`:""}
      <label>1. AI Provider Chunein</label>
      <div class="chs" id="llm_prov_chips">
        ${Object.entries(LLM_PROVIDERS).map(([k,v])=>`
          <button data-prov="${k}" class="${llmState.provider===k?'on':''}">${v.name}</button>
        `).join("")}
      </div>
      <small style="display:block;margin:5px 0 10px;color:var(--mut);font-size:11.5px">${p.desc}</small>
      ${!isOllama?`
        <label>2. API Key *</label>
        <div style="position:relative;display:flex;align-items:center">
          <input type="password" id="llm_key_inp" placeholder="${llmState.hasKey?'Key saved ('+llmState.maskedKey+'). Type new key to change':(p.keyHint||'Paste your API key here (sk-...)')}" style="padding-right:42px" autocomplete="off">
          <button type="button" id="llm_key_toggle" style="position:absolute;right:8px;background:none;border:none;cursor:pointer;font-size:16px;padding:4px" title="Show / Hide key">👁️</button>
        </div>
        ${llmState.hasKey?'<small style="color:#3aa876;font-size:11.5px;display:block;margin-top:4px">✓ API key is already configured.</small>':''}
      `:''}
      <label>${isOllama?'2. Local Model Name':'3. Model Name'}</label>
      <input type="text" id="llm_model_inp" value="${ea(llmState.model)}" placeholder="e.g. ${p.model}">
      <label>${isOllama?'3. Ollama Server URL':'4. Base URL (API Endpoint)'}</label>
      <input type="url" id="llm_url_inp" value="${ea(llmState.url)}" placeholder="${p.url}">
      <div id="llm_status_box" style="margin-top:12px;font-size:12.5px;min-height:20px"></div>
      <div class="pfb" style="margin-top:16px">
        <button id="llm_btn_cancel">Cancel</button>
        <button id="llm_btn_test" class="pvx" style="display:flex;align-items:center;gap:4px">⚡ Test Connection</button>
        <button id="llm_btn_save" class="go">Save &amp; Connect</button>
      </div>
    </div>`;
  llmModal.classList.add("show");
  const close=()=>llmModal.classList.remove("show");
  const closeBtn=llmModal.querySelector("#llm_btn_close");
  const cancelBtn=llmModal.querySelector("#llm_btn_cancel");
  const saveBtn=llmModal.querySelector("#llm_btn_save");
  const testBtn=llmModal.querySelector("#llm_btn_test");
  const toggleBtn=llmModal.querySelector("#llm_key_toggle");
  const keyInp=llmModal.querySelector("#llm_key_inp");
  const modelInp=llmModal.querySelector("#llm_model_inp");
  const urlInp=llmModal.querySelector("#llm_url_inp");
  const statusBox=llmModal.querySelector("#llm_status_box");
  if(closeBtn)closeBtn.onclick=close;
  if(cancelBtn)cancelBtn.onclick=close;
  llmModal.onclick=close;
  if(toggleBtn&&keyInp){
    toggleBtn.onclick=()=>{keyInp.type=keyInp.type==="password"?"text":"password"}
  }
  llmModal.querySelectorAll("[data-prov]").forEach(btn=>{
    btn.onclick=async()=>{
      const prv=btn.dataset.prov;
      llmState.provider=prv;
      llmState.hasKey=false;
      llmState.maskedKey="";
      const def=LLM_PROVIDERS[prv];
      llmState.url=def.url;
      llmState.model=def.model;
      if(window.robonestBridge&&window.robonestBridge.getLLMSettings){
        const saved=await window.robonestBridge.getLLMSettings(prv);
        llmState.hasKey=!!(saved&&saved.has_api_key);
        llmState.maskedKey=(saved&&saved.masked_api_key)||"";
      }
      renderLLMModal();
    }
  });
  if(testBtn){
    testBtn.onclick=async()=>{
      statusBox.innerHTML='<span style="color:var(--mut)">Testing connection... ⏳</span>';
      testBtn.disabled=true;
      const data={
        provider:llmState.provider,
        api_key:keyInp?keyInp.value.trim():"",
        model:modelInp?modelInp.value.trim():llmState.model,
        base_url:urlInp?urlInp.value.trim():llmState.url,
        ollama_url:urlInp?urlInp.value.trim():llmState.url
      };
      const res=await window.robonestBridge.testLLMConnection(data);
      testBtn.disabled=false;
      if(res&&res.ok){
        statusBox.innerHTML=`<span style="color:#3aa876;font-weight:600">✓ ${esc(res.message)} (${res.latency_ms}ms)</span>`;
      }else{
        statusBox.innerHTML=`<span style="color:#e5484d;font-weight:600">✕ ${esc((res&&res.error)||'Failed to connect')}</span>`;
      }
    };
  }
  if(saveBtn){
    saveBtn.onclick=async()=>{
      const apiKeyVal=keyInp?keyInp.value.trim():"";
      const modelVal=modelInp?modelInp.value.trim():llmState.model;
      const urlVal=urlInp?urlInp.value.trim():llmState.url;
      saveBtn.disabled=true;
      statusBox.innerHTML='<span style="color:var(--mut)">Saving settings... 💾</span>';
      const payload={
        provider:llmState.provider,
        api_key:apiKeyVal,
        model:modelVal,
        base_url:urlVal,
        ollama_url:urlVal,
        ollama_model:modelVal
      };
      const res=await window.robonestBridge.saveLLMSettings(payload);
      saveBtn.disabled=false;
      if(res&&res.ok){
        notify("ok","Model Connected",`${res.model} (${res.provider}) active!`);
        zsay(`AI model "${res.model}" is connected. You can now chat with me about anything.`);
        close();
      }else{
        statusBox.innerHTML=`<span style="color:#e5484d;font-weight:600">✕ ${esc((res&&res.error)||'Save failed')}</span>`;
      }
    };
  }
}

function calProject(t){const key=(t.title+" "+t.note).toLowerCase(),kw=[["portfolio",0],["shop",1],["store",1],["landing",2],["blog",3],["cafe",4],["tea",4],["restaurant",4],["agency",5]],hit=kw.find(x=>key.includes(x[0])),tp=TPLS[hit?hit[1]:2];
const brief={desc:t.note.length>=10?t.note:"Website “"+t.title+"”: "+tp.d,tech:tp.tech.slice(),sty:tp.sty.slice(),link:"",pages:tp.pg,imgs:[],colors:{p:tp.c[0],s:tp.c[1]}};
const name=t.title.slice(0,40);let p=PROJ.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!p){p={id:Date.now(),name,stage:0,vers:[]};PROJ.push(p)}
p.vers=p.vers||[];p.vers.push({n:p.vers.length?Math.max(...p.vers.map(v=>v.n))+1:1,ts:Date.now(),brief,done:false});p.av=p.vers.length-1;
Object.assign(p,{name,desc:brief.desc.slice(0,90),st:"active",stage:0,brief});LS.set("z2d_proj",PROJ);startPipe(p);if(!(pipe&&pipe.p===p))return false;calRun[t.id]={proj:p};return true}
function calTask(t,k){const base=TPL[k],names=t.plug.filter(i=>PLS[i]).map(i=>(plOf(i)||[0,i])[1]),tp=Object.assign({},base,{name:t.title.slice(0,40)});
if(names.length){tp.perm=["Use "+names.join(", "),R[k].d.n+" needs "+names.join(", ")+" for “"+t.title.slice(0,30)+"”"];tp.app=names.join(" + ")}
TPL[k]=tp;try{startTask(k,t.title,true)}finally{TPL[k]=base}calRun[t.id]={k,tp}}
function calStart(t,k){const Z=R.Z,short=t.title.length>34?t.title.slice(0,33)+"…":t.title,when=t.date+(t.time?" "+t.time:"");zedBusy=4;
if(t.kind==="project"){if(!calProject(t)){zsay("I couldn’t start “"+t.title+"” yet. I’ll try again shortly.");return}
zsay("Starting the scheduled project “"+t.title+"”. I filled in the brief, and Evaan, Athena, and Lumi will build it in sequence.");say(Z,"Brief filled, team go! 📝",4)}
else{calTask(t,k);zsay("Starting the scheduled task “"+t.title+"”"+(t.date<dstr(new Date())?" (overdue)":"")+". "+R[k].d.n+" is on it.");say(Z,"Today's task: "+short,4)}
t.st="running";calSave();log("Zed","Picked up calendar task “"+t.title+"” ("+when+")");notify("ok","Zed picked a calendar task",t.title);sfx("start");lastH="";dirty=true}
function calTick(){if(!R.Z||!R.Z.g)return;let ch=false;
CAL.forEach(t=>{if(t.st!=="running")return;const ru=calRun[t.id];
if(!ru){t.st="todo";ch=true;return}
if(ru.proj){if(!PROJ.includes(ru.proj)){delete calRun[t.id];t.st="todo";ch=true}else if(ru.proj.st==="done"&&!(pipe&&pipe.p===ru.proj)){calDone(t);ch=true}}
else{const r=R[ru.k];if(!r.tsk||r.tsk.tp!==ru.tp){calDone(t);ch=true}}});
if(ch){calSave();lastH="";dirty=true}
if(dark||calBusy||zGoing)return;
const now=new Date(),today=dstr(now),hm=pad2(now.getHours())+":"+pad2(now.getMinutes());
const t=CAL.filter(x=>x.st==="todo"&&(x.date<today||(x.date===today&&(!x.time||x.time<=hm)))).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||""))).find(x=>calCan(x));
if(!t)return;
calBusy=true;setTimeout(()=>{calBusy=false},25000);
if(R.Z.at!=="recep")say(R.Z,"Calendar task time! 📅",3);
toRecep(R.Z,()=>{calBusy=false;if(t.st!=="todo"||dark)return;const k=calCan(t);if(!k)return;calStart(t,k)})}
function calNL(txt){const m=txt.match(/^\s*(?:calendar|schedule|add\s+task|add\s+to\s+calendar|remind\s+me)\b[\s:,\-]*(.+)$/i);if(!m)return false;
let s=m[1],d=null,tm="",who="auto",r;const now=new Date(),mk=n=>dstr(new Date(now.getFullYear(),now.getMonth(),now.getDate()+n));
if(r=s.match(/\b(?:at|@)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i)||s.match(/\b(\d{1,2}):(\d{2})\s*(am|pm)?\b/i)||s.match(/\b(\d{1,2})()\s*(am|pm)\b/i)){let h=+r[1];const mi=+(r[2]||0),ap=(r[3]||"").toLowerCase();if(ap==="pm"&&h<12)h+=12;if(ap==="am"&&h===12)h=0;if(h<24&&mi<60){tm=pad2(h)+":"+pad2(mi);s=s.replace(r[0],"")}}
if(r=s.match(/\bday\s+after\s+tomorrow\b/i)){d=mk(2);s=s.replace(r[0],"")}
else if(r=s.match(/\b(tomorrow|tmrw)\b/i)){d=mk(1);s=s.replace(r[0],"")}
else if(r=s.match(/\btoday\b/i)){d=mk(0);s=s.replace(r[0],"")}
else if(r=s.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/)){d=r[1]+"-"+pad2(+r[2])+"-"+pad2(+r[3]);s=s.replace(r[0],"")}
else if(r=s.match(/\b(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?\b/)){let y=r[3]?+r[3]:now.getFullYear();if(y<100)y+=2000;d=y+"-"+pad2(+r[2])+"-"+pad2(+r[1]);s=s.replace(r[0],"")}
if(r=s.match(/\b(evaan|evan)\b,?/i)){who="E";s=s.replace(r[0],"")}else if(r=s.match(/\b(lumi|lummi)\b,?/i)){who="L";s=s.replace(r[0],"")}else if(r=s.match(/\bathena\b,?/i)){who="A";s=s.replace(r[0],"")}
const kind=/\b(project|website)\b/i.test(s)?"project":"task";
s=s.replace(/\s+/g," ").replace(/^[\s:,\-]+|[\s:,\-]+$/g,"").replace(/^to\s+/i,"").replace(/\s+(on|at|for|by)$/i,"").trim();
zedBusy=4;say(R.Z,"Got it! 📋",3);
if(!s){zsay("Tell me the task name, for example: “calendar: Design the UI tomorrow at 5pm”.");return true}
if(!d){zsay("Tell me the date, for example: “calendar: "+s+" tomorrow at 5pm” or “"+s+" 25/10”.");return true}
if(d<dstr(now)){zsay("That date has already passed. Choose today or a future date.");return true}
const t={id:Date.now(),title:s.slice(0,60),date:d,time:tm,who,kind,note:"",plug:[],st:"todo"};CAL.push(t);calSave();
const x=new Date(d+"T00:00:00");calSel=d;calView=new Date(x.getFullYear(),x.getMonth(),1);tab="cal";lastH="";dirty=true;
log("You","Added calendar task “"+t.title+"” for "+d);zsay("Added “"+t.title+"” to the calendar for "+d+(tm?" "+tm:"")+". I’ll pick it up that day.");return true}
{const _h=handle;handle=function(txt){if(calNL(txt))return;_h(txt)}}
dock.addEventListener("input",e=>{const el=e.target,ds=el.dataset;if(ds.calf!==undefined){calF[ds.calf]=el.value;return}if(ds.plq!==undefined){plQ=el.value;plApply();return}if(ds.plk&&PLS[ds.plk]){PLS[ds.plk].key=el.value;plSave()}});
dock.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.calf==="title"){e.preventDefault();calAdd();lastH="";dirty=true}});
dock.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
if(d.calDay){calSel=d.calDay;const x=new Date(calSel+"T00:00:00");calView=new Date(x.getFullYear(),x.getMonth(),1);calErr=""}
else if(d.calNav)calView=new Date(calView.getFullYear(),calView.getMonth()+(+d.calNav),1);
else if(d.calToday){const n=new Date();calSel=dstr(n);calView=new Date(n.getFullYear(),n.getMonth(),1)}
else if(d.calPl){const i=calF.plug.indexOf(d.calPl);if(i<0)calF.plug.push(d.calPl);else calF.plug.splice(i,1)}
else if(d.calAdd)calAdd();
else if(d.calNow)calNow(+d.calNow);
else if(d.calDel){const id=+d.calDel;if(calDel===id){const i=CAL.findIndex(x=>x.id===id);if(i>=0){log("You","Removed calendar task “"+CAL[i].title+"”");CAL.splice(i,1);delete calRun[id];calSave()}calDel=null}else{calDel=id;setTimeout(()=>{if(calDel===id){calDel=null;lastH="";dirty=true}},3500)}}
else if(d.plCat)plCat=d.plCat;
else if(d.plAdd)plToggle(d.plAdd,true);
else if(d.plRm)plToggle(d.plRm,false);
else return;
lastH="";dirty=true});
setInterval(calTick,4000);setTimeout(calTick,2500);

frame();

// Route every free-form message through Zed's LLM intent and clarification flow.
handle = async function(txt) {
  if(calNL(txt))return;
  zedBusy=90;
  say(R.Z,"Let me understand that…",2.5);
  const bridge=window.robonestBridge;
  if(!bridge||typeof bridge.chat!=="function"){
    zedBusy=0;
    zsay("Zed’s AI backend could not be loaded. Restart the app and try again.");
    return;
  }
  const result=await bridge.chat(txt,msgs);
  zedBusy=0;
  if(!result.ok){zsay("Could not get an AI response: "+result.error);log("Zed","Chat failed: "+result.error);return}
  zsay(result.response);
  if(result.task_id)log("Zed","Confirmed task started: "+(result.response||txt).slice(0,100));
};
