[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robonest"
version = "1.0.0"
description = "RoboNest - Autonomous Multi-Agent AI Office Backend Brain"
authors = [{ name = "Tanvir & Tahir" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0"
]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["tests*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "keyring>=24.0.0",
    "apscheduler>=3.10.0"
]

[project.scripts]
robonest-server = "backend.main:main"
robonest-cli = "backend.cli:main"
